services:
  # 1. Веб-сервер Nginx
  web:
    image: nginx:latest
    ports:
      - "8080:80" # Пробрасываем порт 8080 хоста на 80 контейнера
    volumes:
      - ./html:/var/www/html # Монтируем папку с сайтом
      - ./nginx-conf/default.conf:/etc/nginx/conf.d/default.conf # Монтируем конфиг
    depends_on:
      - php

  # 2. Бэкенд PHP-FPM
  php:
    build: ./php
    volumes:
      - ./html:/var/www/html # PHP тоже должен видеть файлы сайта

  # 3. База данных MariaDB
  db:
    image: mariadb:10.11
    ports:
      - "3307:3306" # Пробрасываем 3307 порт хоста, чтобы не конфликтовать с локальным (если есть)
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: kelnik_db
      MYSQL_USER: kelnik_user
      MYSQL_PASSWORD: kelnik_pass
    volumes:
      - db_data:/var/lib/mysql # Сохраняем данные базы данных, чтобы они не пропали

volumes:
  db_data:
