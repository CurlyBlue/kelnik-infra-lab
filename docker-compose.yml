services:
  # 1. Веб-сервер Nginx
  web:
    image: nginx:latest
    ports:
      - "8080:80" 
    volumes:
      - ./html:/var/www/html 
      - ./nginx-conf/default.conf:/etc/nginx/conf.d/default.conf 
    depends_on:
      - php

  # 2. Бэкенд PHP-FPM
  php:
    build: ./php
    volumes:
      - ./html:/var/www/html 

  # 3. База данных MariaDB
  db:
    image: mariadb:10.11
    ports:
      - "3307:3306" 
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: kelnik_db
      MYSQL_USER: kelnik_user
      MYSQL_PASSWORD: kelnik_pass
    volumes:
      - db_data:/var/lib/mysql 

volumes:
  db_data:
